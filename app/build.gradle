import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'androidx.room'
    id 'com.google.dagger.hilt.android'
    id 'io.sentry.android.gradle'
}

apply from: "local.gradle"

android {
    compileSdk = 36
    defaultConfig {
        applicationId "fr.jorisfavier.youshallnotpass"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 12
        versionName "1.0.4"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "ANALYTIC_URL", "\"https://app.piratepx.com\""
        buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://jorisfavier.fr/youshallnotpass/privacy-policy\""

    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    productFlavors {
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'fr.jorisfavier.youshallnotpass'
    lint {
        disable 'NullSafeMutableLiveData'
    }
    room {
        schemaDirectory "$projectDir/schemas"
    }
}

dependencies {
    def lifecycle_version = "2.10.0"
    def biometric_version = '1.1.0'
    def camerax_version = "1.5.3"
    def retrofit_version = "3.0.0"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation("androidx.datastore:datastore-preferences:1.2.0")
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    implementation "androidx.biometric:biometric:$biometric_version"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"

    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    //room
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"


    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation "dev.chrisbanes.insetter:insetter:0.6.1"

    //QR recognizer
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // CameraX core library using camera2 implementation
    implementation "androidx.camera:camera-camera2:$camerax_version"
    // CameraX Lifecycle Library
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    // CameraX View class
    implementation "androidx.camera:camera-view:$camerax_version"
    //Do not upgrade before this https://issuetracker.google.com/issues/164901843 got resolved
    implementation "androidx.security:security-crypto:1.1.0-alpha01"

    implementation 'androidx.autofill:autofill:1.3.0'

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofit_version"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.2"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "io.mockk:mockk:1.14.9"
}

sentry {
    ignoredBuildTypes = ["debug"]
}
